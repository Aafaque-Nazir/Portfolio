[build]
  command = "npm install --legacy-peer-deps && npm run build"
  publish = "dist"

[dev]
  command = "npm run dev"

# Legacy 301 Redirects for Old/Moved Routes
[[redirects]]
  from = "/skills*"
  to = "/about/"
  status = 301
  force = true

[[redirects]]
  from = "/projects/8*"
  to = "/projects/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/smooth-scrolling-lenis-react*"
  to = "/blog/lenis-smooth-scroll-react-clean-transitions/"
  status = 301
  force = true

# Proper HTTP 404 for unknown routes (all valid routes are pre-rendered in dist/)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security Headers — Google trusts sites with proper security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Cache static assets aggressively for Core Web Vitals
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
